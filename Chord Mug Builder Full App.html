<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chord Mug Builder</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#ececec;color:#171717}
header{background:#fff;border-bottom:1px solid #d3d3d3;padding:15px 18px}
header h1{margin:0;font-size:24px} header p{margin:4px 0 0;color:#666;font-size:13px}
.app{display:grid;grid-template-columns:370px 1fr;gap:15px;padding:15px}
.panel{background:#fff;border:1px solid #d3d3d3;border-radius:12px;padding:14px}
.controls{display:grid;gap:14px;align-content:start;max-height:calc(100vh - 100px);overflow:auto}
section{display:grid;gap:9px} h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
label{display:grid;gap:5px;font-size:13px;font-weight:700}
input,select{width:100%;height:38px;border:1px solid #bbb;border-radius:8px;padding:6px;background:#fff}
input[type=color]{padding:3px} input[type=range]{padding:0}
.check{display:flex;align-items:center;gap:8px} .check input{width:auto;height:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-buttons{display:grid;gap:8px} button{border:0;border-radius:9px;padding:11px;font-weight:800;background:#e8e8e8;cursor:pointer}
button.active,.primary{background:#111;color:#fff}
.slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status{padding:9px;background:#f2f2f2;border-radius:8px;font-size:12px;font-weight:700;line-height:1.4}
.canvas-panel{overflow:auto;display:flex;justify-content:center;align-items:flex-start;min-height:560px}
#frame{width:min(100%,1163px);aspect-ratio:2327/1086;background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:34px 34px;background-position:0 0,0 17px,17px -17px,-17px 0;box-shadow:0 8px 28px #0003;touch-action:none}
#frame.solid{background-image:none} #frame svg{display:block;width:100%;height:100%}
.chord-slot{cursor:pointer} .chord-slot.selected{filter:drop-shadow(0 0 8px #1677ff)}
.standard-controls,.advanced-controls{display:none}
body.mode-standard .standard-controls,body.mode-standard .shared-edit-controls,
body.mode-advanced .standard-controls,body.mode-advanced .shared-edit-controls,body.mode-advanced .advanced-controls{display:grid}
.shared-edit-controls{display:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:900px){.app{grid-template-columns:1fr}.controls{max-height:none}}
</style>
</head>
<body class="mode-fixed">
<header><h1>Chord Mug Builder</h1><p>Three transparent layouts · fixed, standard editable, and advanced editable</p></header>
<main class="app">
<aside class="panel controls">
<div id="status" class="status">Fixed Transparent selected. Only background and export are editable.</div>

<section><h2>Transparent layouts</h2><div class="mode-buttons">
<button class="mode-btn active" data-mode="fixed">1. Fixed Transparent</button>
<button class="mode-btn" data-mode="standard">2. Standard Editable</button>
<button class="mode-btn" data-mode="advanced">3. Advanced Editable</button>
</div></section>

<section><h2>Background</h2>
<label>Color<input id="bgColor" type="color" value="#f3c969"></label>
<label class="check"><input id="bgVisible" type="checkbox"> Include background color</label>
</section>

<section class="shared-edit-controls"><h2>Header and footer</h2>
<label>Header<input id="titleInput" type="text" value="COFFEE & CHORDS"></label>
<label>Footer<input id="footerInput" type="text" value="O=Open   X=Mute   1=Index   2=Middle   3=Ring   4=Pinky"></label>
<div class="two">
<label>Header size<input id="titleSize" type="range" min="48" max="110" value="78"></label>
<label>Footer size<input id="footerSize" type="range" min="18" max="46" value="32"></label>
</div>
<div class="two">
<label class="check"><input id="showTitle" type="checkbox" checked> Show header</label>
<label class="check"><input id="showFooter" type="checkbox" checked> Show footer</label>
</div>
</section>

function loadMode(name){
  saveCurrent(); mode=name; selected=null;
  document.body.className="mode-"+name;
  q("frame").innerHTML=states[name];
  svg=frame.querySelector("svg");
  wireSlots();
  document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("active",b.dataset.mode===name));
  applyBackground(); syncControlsFromSvg(); applyAppearance(false);
  q("showGuides").checked=false;
  status(name==="fixed"?"Fixed Transparent selected. Only background and export are editable.":name==="standard"?"Standard Editable selected. Positions are locked; header, footer, colors, and chord diagrams are editable.":"Advanced Editable selected. Tap a diagram to move, resize, hide, rename, or replace it.");
}

function status(t){q("status").textContent=t}
document.querySelectorAll(".mode-btn").forEach(b=>b.onclick=()=>loadMode(b.dataset.mode));

function applyBackground(){
  frame.classList.toggle("solid",q("bgVisible").checked);
  frame.style.backgroundColor=q("bgVisible").checked?q("bgColor").value:"#fff";
}
q("bgVisible").onchange=()=>{applyBackground();snapshot()};
q("bgColor").oninput=applyBackground;q("bgColor").onchange=snapshot;

function editText(){
  if(mode==="fixed")return;
  const title=svg.querySelector("#app-title"),footer=svg.querySelector(".app-footer");
  if(title){title.textContent=q("titleInput").value;title.setAttribute("font-size",q("titleSize").value);title.style.display=q("showTitle").checked?"":"none"}
  if(footer){footer.textContent=q("footerInput").value;footer.setAttribute("font-size",q("footerSize").value);footer.style.display=q("showFooter").checked?"":"none"}
}
["titleInput","footerInput","titleSize","footerSize","showTitle","showFooter"].forEach(id=>q(id).addEventListener("input",editText));
["titleInput","footerInput","titleSize","footerSize","showTitle","showFooter"].forEach(id=>q(id).addEventListener("change",snapshot));

function applyAppearance(record=true){
  if(mode==="fixed")return;
  const dc=q("diagramColor").value,nc=q("numberColor").value,name=q("nameColor").value,mc=q("markerColor").value,op=q("diagramOpacity").value/100;
  svg.querySelectorAll(".diagram-line").forEach(e=>e.setAttribute("stroke",dc));
  svg.querySelectorAll(".finger-dot").forEach(e=>{e.setAttribute("fill",dc);e.setAttribute("stroke",dc)});
  svg.querySelectorAll(".finger-number").forEach(e=>e.setAttribute("fill",nc));
  svg.querySelectorAll(".chord-name").forEach(e=>{e.setAttribute("fill",name);e.setAttribute("stroke",name)});
  svg.querySelectorAll(".marker-text").forEach(e=>e.setAttribute("fill",mc));
  svg.querySelectorAll(".chord-slot").forEach(e=>e.setAttribute("opacity",op));
}
["diagramColor","numberColor","nameColor","markerColor","diagramOpacity"].forEach(id=>q(id).oninput=()=>applyAppearance(false));
["diagramColor","numberColor","nameColor","markerColor","diagramOpacity"].forEach(id=>q(id).onchange=snapshot);

function replaceSlot(slotNum,chordName){
  if(mode==="fixed")return;
  const slot=svg.querySelector("#slot-"+slotNum),item=LIBRARY[chordName]; if(!slot||!item)return;
  const base=slot.getAttribute("data-base-transform")||slot.getAttribute("transform")||"";
  slot.innerHTML=item.drawing;
  slot.setAttribute("class","chord-slot");slot.setAttribute("id","slot-"+slotNum);slot.setAttribute("data-slot",slotNum);
  slot.setAttribute("data-base-transform",base);slot.setAttribute("transform",base);
  wireSlot(slot);applyAppearance(false);snapshot();
  status("Slot "+slotNum+" changed to "+chordName+".");
}

document.querySelectorAll(".slot-select").forEach((el,i)=>{
  el.value=DEFAULTS[i];
  el.onchange=()=>replaceSlot(i+1,el.value);
});

function wireSlot(slot){
  slot.onclick=e=>{e.stopPropagation();selectSlot(slot)};
  slot.onpointerdown=e=>{
    if(mode!=="advanced")return;
    e.preventDefault();selectSlot(slot);
    const startX=e.clientX,startY=e.clientY,startDX=+(slot.dataset.dx||0),startDY=+(slot.dataset.dy||0);
    const rect=svg.getBoundingClientRect(),sx=2327/rect.width,sy=1086/rect.height;
    const move=ev=>{q("moveX").value=Math.max(-250,Math.min(250,startDX+(ev.clientX-startX)*sx));q("moveY").value=Math.max(-180,Math.min(180,startDY+(ev.clientY-startY)*sy));applyTransform()};
    const up=()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);snapshot()};
    window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
  };
}
function wireSlots(){svg.querySelectorAll(".chord-slot").forEach(wireSlot)}

function selectSlot(slot){
  if(mode!=="advanced")return;
  svg.querySelectorAll(".selected").forEach(e=>e.classList.remove("selected"));
  selected=slot;slot.classList.add("selected");
  q("selectedName").value=slot.querySelector(".chord-name")?.textContent||"";
  q("moveX").value=slot.dataset.dx||0;q("moveY").value=slot.dataset.dy||0;q("scale").value=slot.dataset.scale||100;
  status("Selected diagram "+slot.dataset.slot+".");
}
function applyTransform(){
  if(!selected||mode!=="advanced")return;
  const dx=+q("moveX").value,dy=+q("moveY").value,sc=+q("scale").value/100,base=selected.getAttribute("data-base-transform")||"";
  selected.dataset.dx=dx;selected.dataset.dy=dy;selected.dataset.scale=Math.round(sc*100);
  selected.setAttribute("transform",base+" translate("+dx+" "+dy+") scale("+sc+")");
}
["moveX","moveY","scale"].forEach(id=>q(id).oninput=applyTransform);
["moveX","moveY","scale"].forEach(id=>q(id).onchange=snapshot);
q("selectedName").oninput=()=>{if(selected&&mode==="advanced"){const n=selected.querySelector(".chord-name");if(n)n.textContent=q("selectedName").value}};
q("selectedName").onchange=snapshot;
q("resetSelected").onclick=()=>{if(!selected)return;selected.setAttribute("transform",selected.getAttribute("data-base-transform")||"");selected.style.display="";selected.dataset.dx=0;selected.dataset.dy=0;selected.dataset.scale=100;q("moveX").value=0;q("moveY").value=0;q("scale").value=100;snapshot()};
q("toggleSelected").onclick=()=>{if(selected){selected.style.display=selected.style.display==="none"?"":"none";snapshot()}};

q("showGuides").onchange=()=>{
  if(mode!=="advanced")return;
  if(!guides){
    guides=document.createElementNS("http://www.w3.org/2000/svg","g");guides.id="app-guides";
    guides.innerHTML='<rect x="80" y="70" width="2167" height="946" fill="none" stroke="#1677ff" stroke-width="4" stroke-dasharray="18 14"/><line x1="1163.5" y1="70" x2="1163.5" y2="1016" stroke="#1677ff" stroke-width="4" stroke-dasharray="18 14"/>';
    svg.appendChild(guides);
  }
  guides.style.display=q("showGuides").checked?"":"none";
};

function snapshot(){
  if(!svg)return;
  const current=new XMLSerializer().serializeToString(svg);
  const stack=undo[mode];
  if(stack[stack.length-1]!==current){stack.push(current);if(stack.length>30)stack.shift()}
  redo[mode]=[];
  states[mode]=current;
}
function restore(source){
  frame.innerHTML=source;svg=frame.querySelector("svg");states[mode]=source;selected=null;guides=svg.querySelector("#app-guides");wireSlots();syncControlsFromSvg();applyBackground();
}
q("undoButton").onclick=()=>{const stack=undo[mode];if(stack.length<2)return;redo[mode].push(stack.pop());restore(stack[stack.length-1])};
q("redoButton").onclick=()=>{const r=redo[mode];if(!r.length)return;const s=r.pop();undo[mode].push(s);restore(s)};

function syncControlsFromSvg(){
  if(mode==="fixed")return;
  const t=svg.querySelector("#app-title"),f=svg.querySelector(".app-footer");
  if(t){q("titleInput").value=t.textContent;q("titleSize").value=t.getAttribute("font-size")||78;q("showTitle").checked=t.style.display!=="none"}
  if(f){q("footerInput").value=f.textContent;q("footerSize").value=f.getAttribute("font-size")||32;q("showFooter").checked=f.style.display!=="none"}
}

q("resetMode").onclick=()=>{initializeState(mode);undo[mode]=[];redo[mode]=[];loadMode(mode)};

q("saveProject").onclick=()=>{
  saveCurrent();
  const project={version:1,mode,states,background:{visible:q("bgVisible").checked,color:q("bgColor").value}};
  download(new Blob([JSON.stringify(project)],{type:"application/json"}),"Chord Mug Project.json");
};
q("loadProject").onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  try{const p=JSON.parse(await file.text());Object.assign(states,p.states||{});q("bgVisible").checked=!!p.background?.visible;q("bgColor").value=p.background?.color||"#f3c969";loadMode(p.mode||"standard");status("Project loaded.")}catch(err){status("Could not load project file.")}
};

function exportClone(){
  const c=svg.cloneNode(true);c.querySelectorAll(".selected").forEach(e=>e.classList.remove("selected"));c.querySelector("#app-guides")?.remove();c.setAttribute("width","2327");c.setAttribute("height","1086");
  if(q("bgVisible").checked){const r=document.createElementNS("http://www.w3.org/2000/svg","rect");r.setAttribute("width","2327");r.setAttribute("height","1086");r.setAttribute("fill",q("bgColor").value);c.insertBefore(r,c.firstChild)}
  return c;
}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
q("exportSvg").onclick=()=>{const c=exportClone();download(new Blob([new XMLSerializer().serializeToString(c)],{type:"image/svg+xml"}),"Chord Mug.svg")};
q("exportPng").onclick=()=>{const c=exportClone(),url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(c)],{type:"image/svg+xml"})),img=new Image();img.onload=()=>{const cv=document.createElement("canvas");cv.width=2327;cv.height=1086;cv.getContext("2d").drawImage(img,0,0);URL.revokeObjectURL(url);cv.toBlob(b=>download(b,"Chord Mug.png"),"image/png")};img.onerror=()=>status("PNG export failed in this browser. SVG export is available.");img.src=url};

loadMode("fixed");snapshot();
</script>
</body>
</html>
