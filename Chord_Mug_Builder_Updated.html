const frame=document.getElementById('builder');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  if(!doc) return;
  const icon=doc.querySelector('.title-mug-icon');
  if(icon){
    icon.innerHTML=`<img src="${MUG_ICON}" alt="" style="display:block;width:100%;height:100%;object-fit:contain">`;
    icon.style.width='52px';
    icon.style.height='58px';
    icon.style.marginRight='12px';
  }
  const reset=doc.getElementById('resetMode');
  if(reset) reset.textContent='Reset Layout';
  const style=doc.createElement('style');
  style.textContent=`
    button{
      position:relative;
      border:1px solid #cfd3da !important;
      border-radius:12px !important;
      padding:11px 13px;
      font-weight:850;
      color:#222;
      background:linear-gradient(180deg,#ffffff 0%,#eef0f4 100%) !important;
      box-shadow:0 3px 0 #c4c8d0,0 7px 15px rgba(0,0,0,.10);
      cursor:pointer;
      transition:transform .14s ease,box-shadow .14s ease,filter .14s ease,border-color .14s ease;
    }
    button:hover{
      transform:translateY(-2px);
      filter:brightness(1.025);
      border-color:#aeb5c0 !important;
      box-shadow:0 5px 0 #bdc2ca,0 10px 20px rgba(0,0,0,.15);
    }
    button:active{
      transform:translateY(2px);
      box-shadow:0 1px 0 #b9bec7,0 3px 8px rgba(0,0,0,.13);
    }
    button:focus-visible{outline:3px solid #56a0ff;outline-offset:3px}
    button.active,.primary{
      color:#fff !important;
      border-color:#111827 !important;
      background:linear-gradient(135deg,#10151f 0%,#303b4d 52%,#111827 100%) !important;
      box-shadow:0 3px 0 #05070b,0 8px 18px rgba(0,0,0,.25);
    }
    .mode-buttons button{
      text-align:left;
      border-left:5px solid #aeb5c0 !important;
    }
    .mode-buttons button.active{
      border-left-color:#ff9f43 !important;
      background:linear-gradient(135deg,#171b25,#343d4d) !important;
    }
    #resetMode{
      color:#7b2f0b !important;
      border-color:#efa879 !important;
      background:linear-gradient(135deg,#fff7f0,#ffd9c2) !important;
      box-shadow:0 3px 0 #e3a077,0 7px 15px rgba(122,47,11,.14);
    }
    #resetDiagrams{
      color:#563d00 !important;
      border-color:#e4c35d !important;
      background:linear-gradient(135deg,#fffceb,#ffeaa2) !important;
      box-shadow:0 3px 0 #d7bb62,0 7px 15px rgba(86,61,0,.12);
    }
    #exportPng{
      border-color:#174c9c !important;
      background:linear-gradient(135deg,#13233e,#2563c7 58%,#174b9d) !important;
    }
    #exportSvg{
      color:#0c4b3b !important;
      border-color:#74c6ad !important;
      background:linear-gradient(135deg,#effff9,#bcebdc) !important;
      box-shadow:0 3px 0 #83c9b4,0 7px 15px rgba(12,75,59,.12);
    }
    .number-color-btn.active{
      color:#fff !important;
      background:linear-gradient(135deg,#111827,#374151) !important;
    }
  `;
  doc.head.appendChild(style);
});
