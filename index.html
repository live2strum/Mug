<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chord Mug Builder</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Anton&family=Archivo+Black&family=Bangers&family=Bebas+Neue&family=Black+Ops+One&family=Boogaloo&family=Bowlby+One+SC&family=Bungee&family=Bungee+Shade&family=Cinzel+Decorative:wght@700&family=Creepster&family=Faster+One&family=Frijole&family=Graduate&family=Knewave&family=Lacquer&family=Lilita+One&family=Lobster&family=Metal+Mania&family=Monoton&family=New+Rocker&family=Nosifer&family=Oswald:wght@400;700&family=Permanent+Marker&family=Pirata+One&family=Press+Start+2P&family=Rock+Salt&family=Rubik+Distressed&family=Rubik+Glitch&family=Rye&family=Sancreek&family=Sedgwick+Ave+Display&family=Special+Elite&family=Staatliches&family=Trade+Winds&family=Ultra&family=UnifrakturCook:wght@700&display=swap');
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#ececec;color:#171717}
header{background:#fff;border-bottom:1px solid #d3d3d3;padding:10px 18px 12px}
header h1{margin:0;display:flex;align-items:center;min-height:158px}
.title-mug-icon{display:inline-flex;width:150px;height:158px;margin-right:20px;flex:0 0 auto;align-items:center;justify-content:center;filter:drop-shadow(0 7px 7px rgba(0,0,0,.25))}
.title-mug-icon img{display:block;width:100%;height:100%;object-fit:contain}
.builder-name{display:inline-flex;align-items:baseline;gap:12px;flex-wrap:wrap;font-family:'Rye',Georgia,serif;text-transform:uppercase;line-height:.92;letter-spacing:1.2px;color:#f4e2b8;-webkit-text-stroke:2px #21150d;text-shadow:0 3px 0 #a62820,0 6px 0 #21150d,0 9px 12px rgba(0,0,0,.28);transform:rotate(-1deg)}
.builder-name .word-chord{font-size:52px}
.builder-name .word-mug{font-size:43px;color:#c73a2d}
.builder-name .word-builder{font-family:'Bebas Neue',Impact,sans-serif;font-size:49px;letter-spacing:3px;color:#2a2521;-webkit-text-stroke:1px #2a2521;text-shadow:2px 2px 0 #e6c890,4px 4px 0 #a62820}
header p{margin:-18px 0 0 170px;color:#666;font-size:13px}
@media(max-width:700px){header h1{min-height:118px}.title-mug-icon{width:108px;height:114px;margin-right:10px}.builder-name{gap:7px}.builder-name .word-chord{font-size:34px}.builder-name .word-mug{font-size:29px}.builder-name .word-builder{font-size:32px;letter-spacing:2px}header p{margin:-8px 0 0 118px}}
.app{display:grid;grid-template-columns:370px 1fr;gap:15px;padding:15px}
.panel{background:#fff;border:1px solid #d3d3d3;border-radius:12px;padding:14px}
.controls{display:grid;gap:14px;align-content:start;max-height:calc(100vh - 100px);overflow:auto}
section{display:grid;gap:9px} h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
label{display:grid;gap:5px;font-size:13px;font-weight:700}
input,select{width:100%;height:38px;border:1px solid #bbb;border-radius:8px;padding:6px;background:#fff}
input[type=color]{padding:3px} input[type=range]{padding:0}
.check{display:flex;align-items:center;gap:8px} .check input{width:auto;height:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-buttons{display:grid;gap:10px}.mode-buttons button{font-size:18px;line-height:1.2;padding:14px 12px;min-height:54px} button{border:0;border-radius:9px;padding:11px;font-weight:800;background:#e8e8e8;cursor:pointer}
button.active,.primary{background:#111;color:#fff}
.slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status{padding:9px;background:#f2f2f2;border-radius:8px;font-size:12px;font-weight:700;line-height:1.4}.exporting{opacity:.65;pointer-events:none}
.canvas-panel{overflow:auto;display:flex;justify-content:center;align-items:flex-start;min-height:560px}
#frame{width:min(100%,1163px);aspect-ratio:2327/1086;background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:34px 34px;background-position:0 0,0 17px,17px -17px,-17px 0;box-shadow:0 8px 28px #0003;touch-action:none}
#frame.solid{background-image:none} #frame{position:relative;overflow:hidden}#bgPreviewImage{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}#frame svg{position:relative;z-index:1;display:block;width:100%;height:100%}
.chord-slot{cursor:pointer} .chord-slot.selected{filter:drop-shadow(0 0 8px #1677ff)}
.standard-controls,.advanced-controls{display:none}
body.mode-standard .standard-controls,body.mode-standard .shared-edit-controls,
body.mode-advanced .standard-controls,body.mode-advanced .shared-edit-controls,body.mode-advanced .advanced-controls{display:grid}
.shared-edit-controls{display:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:900px){.app{grid-template-columns:1fr}.controls{max-height:none}}

/* Polished button treatment */
button{
  position:relative;
  border:1px solid #cfd3da;
  border-radius:12px;
  padding:11px 13px;
  font-weight:800;
  color:#222;
  background:linear-gradient(180deg,#fff 0%,#eef0f4 100%);
  box-shadow:0 3px 0 #c4c8d0,0 7px 15px rgba(0,0,0,.10);
  cursor:pointer;
  transition:transform .14s ease,box-shadow .14s ease,filter .14s ease,border-color .14s ease;
}
button:hover{transform:translateY(-2px);filter:brightness(1.025);border-color:#aeb5c0;box-shadow:0 5px 0 #bdc2ca,0 10px 20px rgba(0,0,0,.15)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #b9bec7,0 3px 8px rgba(0,0,0,.13)}
button:focus-visible{outline:3px solid #56a0ff;outline-offset:3px}
button.active,.primary{color:#fff;background:linear-gradient(135deg,#10151f 0%,#303b4d 52%,#111827 100%);border-color:#111827;box-shadow:0 3px 0 #05070b,0 8px 18px rgba(0,0,0,.25)}
.mode-buttons button{text-align:left;border-left:5px solid #aeb5c0}
.mode-buttons button.active{border-left-color:#ff9f43;background:linear-gradient(135deg,#171b25,#343d4d)}
#resetMode{color:#7b2f0b;border-color:#efa879;background:linear-gradient(180deg,#fff8f2 0%,#ffd9be 100%);box-shadow:0 3px 0 #df9565,0 7px 15px rgba(131,64,18,.16)}
#resetMode:hover{border-color:#dc7e43;box-shadow:0 5px 0 #d78b58,0 10px 20px rgba(131,64,18,.22)}
#exportPng{border-color:#111827}
#exportSvg{color:#153e75;border-color:#8db6e7;background:linear-gradient(180deg,#f8fbff 0%,#dcecff 100%);box-shadow:0 3px 0 #8fb5df,0 7px 15px rgba(31,78,121,.14)}
.number-color-btn.active{color:#fff;background:linear-gradient(135deg,#10151f,#303b4d)}

/* Official Chord Mug Builder banner */
.builder-banner-header{background:#111;padding:0;border-bottom:1px solid #2c2119;overflow:hidden}
.builder-banner-header .builder-banner-image{display:block;width:100%;height:auto;aspect-ratio:2804/422;object-fit:cover;object-position:center}
@media(max-width:700px){.builder-banner-header .builder-banner-image{aspect-ratio:2804/422;height:auto;min-height:0;object-fit:cover}}
</style>
</head>

function normalizeLibraryDiagram(slot){
  // Library drawings were authored on a slightly smaller coordinate grid.
  // Normalize them to the exact geometry used by the original fixed layout.
  const mapX=v=>58+((v-55)*(204/190));
  const setNum=(el,attr,value)=>el.setAttribute(attr,String(Math.round(value*1000)/1000));

  slot.querySelectorAll("[x]").forEach(el=>{
    if(el.classList.contains("chord-name"))return;
    setNum(el,"x",mapX(parseFloat(el.getAttribute("x"))));
  });
  slot.querySelectorAll("[x1]").forEach(el=>setNum(el,"x1",mapX(parseFloat(el.getAttribute("x1")))));
  slot.querySelectorAll("[x2]").forEach(el=>setNum(el,"x2",mapX(parseFloat(el.getAttribute("x2")))));
  slot.querySelectorAll("[cx]").forEach(el=>setNum(el,"cx",mapX(parseFloat(el.getAttribute("cx")))));

  const mapY=(v,el)=>{
    if(el.classList.contains("marker-text"))return v+19;
    if(v<=90)return v+12;
    return v+15;
  };
  slot.querySelectorAll("[y]").forEach(el=>{
    if(el.classList.contains("chord-name"))return;
    setNum(el,"y",mapY(parseFloat(el.getAttribute("y")),el));
  });
  slot.querySelectorAll("[y1]").forEach(el=>setNum(el,"y1",mapY(parseFloat(el.getAttribute("y1")),el)));
  slot.querySelectorAll("[y2]").forEach(el=>setNum(el,"y2",mapY(parseFloat(el.getAttribute("y2")),el)));
  slot.querySelectorAll("[cy]").forEach(el=>setNum(el,"cy",mapY(parseFloat(el.getAttribute("cy")),el)));

  slot.querySelectorAll(".diagram-line").forEach(el=>{
    const w=parseFloat(el.getAttribute("stroke-width")||"0");
    // Preserve connected finger barres at the same thickness as the original diagrams.
    if(w>=20)el.setAttribute("stroke-width","34");
    else if(w>=5.5)el.setAttribute("stroke-width","7");
    else if(w>=2.8)el.setAttribute("stroke-width","3.4");
    else el.setAttribute("stroke-width","2.5");
  });
  slot.querySelectorAll("circle").forEach(el=>{
    const r=parseFloat(el.getAttribute("r")||"0");
    el.setAttribute("r",r>=14?"17":"9");
    if(!el.classList.contains("finger-dot"))el.setAttribute("stroke-width","3");
  });
  slot.querySelectorAll(".finger-number").forEach(el=>{
    el.setAttribute("font-size","18");
    el.setAttribute("font-weight","900");
    el.setAttribute("font-family","DejaVu Sans, Arial, Helvetica, sans-serif");
  });
  slot.querySelectorAll(".marker-text").forEach(el=>{
    el.setAttribute("font-size","18");
    el.setAttribute("font-weight","700");
    el.setAttribute("font-family","DejaVu Sans, Arial, Helvetica, sans-serif");
  });
}

    const up=()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);snapshot()};
    window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
  };
}
function wireSlots(){svg.querySelectorAll(".chord-slot").forEach(wireSlot)}

function selectSlot(slot){
  if(mode!=="advanced")return;

}
function applyTransform(){
  if(!selected||mode!=="advanced")return;
  const dx=+q("moveX").value,dy=+q("moveY").value,sc=+q("scale").value/100,base=selected.getAttribute("data-base-transform")||"";
  selected.dataset.dx=dx;selected.dataset.dy=dy;selected.dataset.scale=Math.round(sc*100);
  selected.setAttribute("transform",base+" translate("+dx+" "+dy+") scale("+sc+")");
}
["moveX","moveY","scale"].forEach(id=>q(id).oninput=applyTransform);

function snapshot(){
  if(!svg)return;
  const current=new XMLSerializer().serializeToString(svg);
  const stack=undo[mode];
  if(stack[stack.length-1]!==current){stack.push(current);if(stack.length>30)stack.shift()}
  redo[mode]=[];
  states[mode]=current;
}
function restore(source){
  frame.querySelector("svg")?.remove();frame.insertAdjacentHTML("beforeend",source);svg=frame.querySelector("svg");states[mode]=source;selected=null;guides=svg.querySelector("#app-guides");wireSlots();syncControlsFromSvg();applyBackground();
}
q("undoButton").onclick=()=>{const stack=undo[mode];if(stack.length<2)return;redo[mode].push(stack.pop());restore(stack[stack.length-1])};
q("redoButton").onclick=()=>{const r=redo[mode];if(!r.length)return;const s=r.pop();undo[mode].push(s);restore(s)};

function syncControlsFromSvg(){

  });

  selected=null;wireSlots();applyAppearance(false);snapshot();

};

const GOOGLE_FONT_CSS_URL="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Anton&family=Archivo+Black&family=Bangers&family=Bebas+Neue&family=Black+Ops+One&family=Boogaloo&family=Bowlby+One+SC&family=Bungee&family=Bungee+Shade&family=Cinzel+Decorative:wght@700&family=Creepster&family=Faster+One&family=Frijole&family=Graduate&family=Knewave&family=Lacquer&family=Lilita+One&family=Lobster&family=Metal+Mania&family=Monoton&family=New+Rocker&family=Nosifer&family=Oswald:wght@400;700&family=Permanent+Marker&family=Pirata+One&family=Press+Start+2P&family=Rock+Salt&family=Rubik+Distressed&family=Rubik+Glitch&family=Rye&family=Sancreek&family=Sedgwick+Ave+Display&family=Special+Elite&family=Staatliches&family=Trade+Winds&family=Ultra&family=UnifrakturCook:wght@700&display=swap";
let embeddedFontCssPromise=null;

function blobToDataUrl(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(blob);
  });
}

async function getEmbeddedGoogleFontCss(){
  if(embeddedFontCssPromise)return embeddedFontCssPromise;
  embeddedFontCssPromise=(async()=>{
    try{
      const cssResponse=await fetch(GOOGLE_FONT_CSS_URL);
      if(!cssResponse.ok)throw new Error("Font CSS request failed");
      let css=await cssResponse.text();
      const urls=[...css.matchAll(/url\((https:[^)]+)\)/g)].map(m=>m[1]);
      const unique=[...new Set(urls)];
      for(const url of unique){
        const response=await fetch(url);
        if(!response.ok)continue;
        const dataUrl=await blobToDataUrl(await response.blob());
        css=css.split(url).join(dataUrl);
      }
      return css;
    }catch(error){
      console.warn("Could not embed web fonts for export.",error);
      return "";
    }
  })();
  return embeddedFontCssPromise;
}

async function exportClone(){
  await document.fonts.ready;
  const c=svg.cloneNode(true);
  c.querySelectorAll(".selected").forEach(e=>e.classList.remove("selected"));
  c.querySelector("#app-guides")?.remove();
  c.setAttribute("width","2327");
  c.setAttribute("height","1086");

  const fontCss=await getEmbeddedGoogleFontCss();
  if(fontCss){
    const defs=document.createElementNS("http://www.w3.org/2000/svg","defs");
    const style=document.createElementNS("http://www.w3.org/2000/svg","style");
    style.textContent=fontCss;
    defs.appendChild(style);
    c.insertBefore(defs,c.firstChild);
  }

  if(q("bgVisible").checked){
    const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
    r.setAttribute("width","2327");
    r.setAttribute("height","1086");
    r.setAttribute("fill",q("bgColor").value);
    c.insertBefore(r,c.firstChild);
  }

  if(backgroundImageData){
    const im=document.createElementNS("http://www.w3.org/2000/svg","image");
    im.setAttribute("href",backgroundImageData);
    im.setAttribute("x","0");
    im.setAttribute("y","0");
    im.setAttribute("width","2327");
    im.setAttribute("height","1086");
    im.setAttribute("opacity",q("bgOpacity").value/100);
    const fit=q("bgFit").value;
    im.setAttribute("preserveAspectRatio",fit==="stretch"?"none":fit==="contain"?"xMidYMid meet":"xMidYMid slice");
    const first=c.firstChild;
    if(first && first.tagName==="rect")c.insertBefore(im,first.nextSibling);
    else c.insertBefore(im,first);
  }
  return c;
}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
q("exportSvg").onclick=async()=>{
  document.body.classList.add("exporting");
  status("Preparing fonts for SVG export...");
  try{
    const c=await exportClone();
    download(new Blob([new XMLSerializer().serializeToString(c)],{type:"image/svg+xml"}),"Chord Mug.svg");
    status("SVG exported.");
  }finally{
    document.body.classList.remove("exporting");
  }
};

q("exportPng").onclick=async()=>{
  document.body.classList.add("exporting");
  status("Preparing fonts for PNG export...");
  try{
    const c=await exportClone();
    const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(c)],{type:"image/svg+xml"}));
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement("canvas");
      cv.width=2327;
      cv.height=1086;
      cv.getContext("2d").drawImage(img,0,0);
      URL.revokeObjectURL(url);
      cv.toBlob(blob=>{
        download(blob,"Chord Mug.png");
        status("PNG exported with embedded fonts.");
        document.body.classList.remove("exporting");
      },"image/png");
    };
    img.onerror=()=>{
      URL.revokeObjectURL(url);
      status("PNG export failed. Try again after the fonts finish loading.");
      document.body.classList.remove("exporting");
    };
    img.src=url;
  }catch(error){
    console.error(error);
    status("PNG export failed.");
    document.body.classList.remove("exporting");
  }
};
