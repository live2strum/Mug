<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chord Mug Builder</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Anton&family=Archivo+Black&family=Bangers&family=Bebas+Neue&family=Black+Ops+One&family=Boogaloo&family=Bowlby+One+SC&family=Bungee&family=Bungee+Shade&family=Cinzel+Decorative:wght@700&family=Creepster&family=Faster+One&family=Frijole&family=Graduate&family=Knewave&family=Lacquer&family=Lilita+One&family=Lobster&family=Metal+Mania&family=Monoton&family=New+Rocker&family=Nosifer&family=Oswald:wght@400;700&family=Permanent+Marker&family=Pirata+One&family=Press+Start+2P&family=Rock+Salt&family=Rubik+Distressed&family=Rubik+Glitch&family=Rye&family=Sancreek&family=Sedgwick+Ave+Display&family=Special+Elite&family=Staatliches&family=Trade+Winds&family=Ultra&family=UnifrakturCook:wght@700&display=swap');
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#ececec;color:#171717}
header{background:#fff;border-bottom:1px solid #d3d3d3;padding:15px 18px}
.title-mug-icon{display:inline-flex;width:54px;height:58px;margin-right:12px;vertical-align:middle;align-items:center;justify-content:center}.title-mug-icon img{display:block;width:100%;height:100%;object-fit:contain}header h1{margin:0;font-size:24px} header p{margin:4px 0 0;color:#666;font-size:13px}
.app{display:grid;grid-template-columns:370px 1fr;gap:15px;padding:15px}
.panel{background:#fff;border:1px solid #d3d3d3;border-radius:12px;padding:14px}
.controls{display:grid;gap:14px;align-content:start;max-height:calc(100vh - 100px);overflow:auto}
section{display:grid;gap:9px} h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
label{display:grid;gap:5px;font-size:13px;font-weight:700}
input,select{width:100%;height:38px;border:1px solid #bbb;border-radius:8px;padding:6px;background:#fff}
input[type=color]{padding:3px} input[type=range]{padding:0}
.check{display:flex;align-items:center;gap:8px} .check input{width:auto;height:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-buttons{display:grid;gap:10px}.mode-buttons button{font-size:18px;line-height:1.2;padding:14px 12px;min-height:54px} button{border:0;border-radius:9px;padding:11px;font-weight:800;background:#e8e8e8;cursor:pointer}
button.active,.primary{background:#111;color:#fff}
.slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status{padding:9px;background:#f2f2f2;border-radius:8px;font-size:12px;font-weight:700;line-height:1.4}.exporting{opacity:.65;pointer-events:none}
.canvas-panel{overflow:auto;display:flex;justify-content:center;align-items:flex-start;min-height:560px}
#frame{width:min(100%,1163px);aspect-ratio:2327/1086;background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:34px 34px;background-position:0 0,0 17px,17px -17px,-17px 0;box-shadow:0 8px 28px #0003;touch-action:none}
#frame.solid{background-image:none} #frame{position:relative;overflow:hidden}#bgPreviewImage{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}#frame svg{position:relative;z-index:1;display:block;width:100%;height:100%}
.chord-slot{cursor:pointer} .chord-slot.selected{filter:drop-shadow(0 0 8px #1677ff)}
.standard-controls,.advanced-controls{display:none}
body.mode-standard .standard-controls,body.mode-standard .shared-edit-controls,
body.mode-advanced .standard-controls,body.mode-advanced .shared-edit-controls,body.mode-advanced .advanced-controls{display:grid}
.shared-edit-controls{display:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:900px){.app{grid-template-columns:1fr}.controls{max-height:none}}

/* Polished button treatment */
button{
  position:relative;
  border:1px solid #cfd3da;
  border-radius:12px;
  padding:11px 13px;
  font-weight:800;
  color:#222;
  background:linear-gradient(180deg,#fff 0%,#eef0f4 100%);
  box-shadow:0 3px 0 #c4c8d0,0 7px 15px rgba(0,0,0,.10);
  cursor:pointer;
  transition:transform .14s ease,box-shadow .14s ease,filter .14s ease,border-color .14s ease;
}
button:hover{transform:translateY(-2px);filter:brightness(1.025);border-color:#aeb5c0;box-shadow:0 5px 0 #bdc2ca,0 10px 20px rgba(0,0,0,.15)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #b9bec7,0 3px 8px rgba(0,0,0,.13)}
button:focus-visible{outline:3px solid #56a0ff;outline-offset:3px}
button.active,.primary{color:#fff;background:linear-gradient(135deg,#10151f 0%,#303b4d 52%,#111827 100%);border-color:#111827;box-shadow:0 3px 0 #05070b,0 8px 18px rgba(0,0,0,.25)}
.mode-buttons button{text-align:left;border-left:5px solid #aeb5c0}
.mode-buttons button.active{border-left-color:#ff9f43;background:linear-gradient(135deg,#171b25,#343d4d)}
#resetMode{color:#7b2f0b;border-color:#efa879;background:linear-gradient(180deg,#fff8f2 0%,#ffd9be 100%);box-shadow:0 3px 0 #df9565,0 7px 15px rgba(131,64,18,.16)}
#resetMode:hover{border-color:#dc7e43;box-shadow:0 5px 0 #d78b58,0 10px 20px rgba(131,64,18,.22)}
#exportPng{border-color:#111827}
#exportSvg{color:#153e75;border-color:#8db6e7;background:linear-gradient(180deg,#f8fbff 0%,#dcecff 100%);box-shadow:0 3px 0 #8fb5df,0 7px 15px rgba(31,78,121,.14)}
.number-color-btn.active{color:#fff;background:linear-gradient(135deg,#10151f,#303b4d)}
</style>

<main class="app">
<aside class="panel controls">
<div id="status" class="status">Fixed Transparent selected. Only background and export are editable.</div>

<section><h2>Transparent layouts</h2><div class="mode-buttons">
<button class="mode-btn active" data-mode="fixed">1. Fixed Transparent</button>
<button class="mode-btn" data-mode="standard">2. Standard Editable</button>
<button class="mode-btn" data-mode="advanced">3. Advanced Editable</button>
</div></section>

<section><h2>Background</h2>
<label>Color<input id="bgColor" type="color" value="#ffffff"></label>
<label class="check"><input id="bgVisible" type="checkbox" checked> Include background color</label>
<label>Upload image<input id="bgUpload" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"></label>
<label>Image fit<select id="bgFit">
<option value="cover">Cover canvas</option>
<option value="contain">Fit inside canvas</option>
<option value="stretch">Stretch to canvas</option>
</select></label>
<label>Image opacity<input id="bgOpacity" type="range" min="10" max="100" value="100"></label>
<button id="removeBgImage">Remove background image</button>
</section>

<section class="shared-edit-controls"><h2>Header and footer</h2>
<label>Header<input id="titleInput" type="text" value="COFFEE & CHORDS"></label>
<label>Footer<input id="footerInput" type="text" value="O=Open   X=Mute   1=Index   2=Middle   3=Ring   4=Pinky"></label>
<div class="two">
<label>Header color<input id="titleColor" type="color" value="#111111"></label>
<label>Footer color<input id="footerColor" type="color" value="#111111"></label>
</div>
<div class="two">
<label>Header font<select id="titleFont">
<optgroup label="Rock & Retro">

const DEFAULTS=["C", "G", "D", "A", "E", "Em", "Am", "Dm", "A7", "D7", "B7", "F"];
const q=id=>document.getElementById(id);
const frame=q("frame");
let mode="fixed",svg=null,selected=null,guides=null;
const states={fixed:null,standard:null,advanced:null};
const undo={fixed:[],standard:[],advanced:[]}, redo={fixed:[],standard:[],advanced:[]};

function freshSvg(){
  const frag=q("baseTemplate").content.cloneNode(true);
  return frag.querySelector("svg");
}

function initializeState(name){
  const s=freshSvg();
  s.dataset.mode=name;
  if(name!=="fixed"){
    // Replace separate footer pieces with one centered footer object.
    s.querySelectorAll(".footer-piece").forEach(e=>e.remove());
    const f=document.createElementNS("http://www.w3.org/2000/svg","text");
    f.setAttribute("x","1163.5");f.setAttribute("y","1048");f.setAttribute("text-anchor","middle");
    f.setAttribute("font-family","DejaVu Sans, Arial, sans-serif");f.setAttribute("font-size","32");
    f.setAttribute("font-weight","600");f.setAttribute("fill","#111");f.setAttribute("class","app-footer");
    f.textContent=q("footerInput").value;s.appendChild(f);
  }
  states[name]=new XMLSerializer().serializeToString(s);
}

["fixed","standard","advanced"].forEach(initializeState);

function saveCurrent(){
  if(svg)states[mode]=new XMLSerializer().serializeToString(svg);
}

function loadMode(name){
  saveCurrent(); mode=name; selected=null;
  document.body.className="mode-"+name;
  frame.querySelector("svg")?.remove();
  frame.insertAdjacentHTML("beforeend",states[name]);
  svg=frame.querySelector("svg");
  wireSlots();
  document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("active",b.dataset.mode===name));
  applyBackground(); syncControlsFromSvg(); applyAppearance(false);
  q("showGuides").checked=false;
  status(name==="fixed"?"Fixed Transparent selected. Only background and export are editable.":name==="standard"?"Standard Editable selected. Positions are locked; header, footer, colors, and chord diagrams are editable.":"Advanced Editable selected. Tap a diagram to move, resize, hide, rename, or replace it.");
}

function status(t){q("status").textContent=t}
document.querySelectorAll(".mode-btn").forEach(b=>b.onclick=()=>loadMode(b.dataset.mode));

let backgroundImageData="";
function applyBackground(){
  const preview=q("bgPreviewImage");
  frame.classList.toggle("solid",q("bgVisible").checked || !!backgroundImageData);
  frame.style.backgroundColor=q("bgVisible").checked?q("bgColor").value:"#ffffff";
  frame.style.backgroundImage="";
  if(backgroundImageData){
    preview.hidden=false;
    preview.src=backgroundImageData;
    preview.style.opacity=String(q("bgOpacity").value/100);
    preview.style.objectFit=q("bgFit").value==="stretch"?"fill":q("bgFit").value;
  }else{
    preview.hidden=true;
    preview.removeAttribute("src");
    preview.style.opacity="1";
  }
}
q("bgVisible").onchange=()=>{applyBackground();snapshot()};
q("bgColor").oninput=applyBackground;q("bgColor").onchange=snapshot;
q("bgFit").onchange=()=>{applyBackground();snapshot()};
q("bgOpacity").oninput=applyBackground;q("bgOpacity").onchange=snapshot;
q("bgUpload").onchange=e=>{
  const file=e.target.files && e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{backgroundImageData=reader.result;applyBackground();snapshot();status("Background image loaded.")};
  reader.readAsDataURL(file);
};
q("removeBgImage").onclick=()=>{backgroundImageData="";q("bgUpload").value="";applyBackground();snapshot();status("Background image removed.")};

function editText(){
  if(mode==="fixed")return;
  const title=svg.querySelector("#app-title"),footer=svg.querySelector(".app-footer");
  if(title){
    title.textContent=q("titleInput").value;
    title.setAttribute("font-size",q("titleSize").value);
    title.setAttribute("font-family",q("titleFont").value);
    title.setAttribute("fill",q("titleColor").value);
    title.setAttribute("stroke",q("titleColor").value);
    title.setAttribute("letter-spacing",q("headerSpacing").value);
    title.style.display=q("showTitle").checked?"":"none";
  }
  if(footer){
    footer.textContent=q("footerInput").value;
    footer.setAttribute("font-size",q("footerSize").value);
    footer.setAttribute("font-family",q("footerFont").value);
    footer.setAttribute("fill",q("footerColor").value);
    footer.setAttribute("letter-spacing",q("footerSpacing").value);
    footer.style.display=q("showFooter").checked?"":"none";
  }
}
["titleInput","footerInput","titleColor","footerColor","titleFont","footerFont","titleSize","footerSize","headerSpacing","footerSpacing","showTitle","showFooter"].forEach(id=>q(id).addEventListener("input",editText));
["titleInput","footerInput","titleColor","footerColor","titleFont","footerFont","titleSize","footerSize","headerSpacing","footerSpacing","showTitle","showFooter"].forEach(id=>q(id).addEventListener("change",snapshot));

function applyAppearance(record=true){
  if(mode==="fixed")return;
  const dc=q("diagramColor").value,nc=q("numberColor").value,name=q("nameColor").value,op=q("diagramOpacity").value/100,font=q("chordFont").value;
  svg.querySelectorAll(".diagram-line").forEach(e=>e.setAttribute("stroke",dc));
  svg.querySelectorAll(".finger-dot").forEach(e=>{e.setAttribute("fill",dc);e.setAttribute("stroke",dc)});
  svg.querySelectorAll(".finger-number").forEach(e=>e.setAttribute("fill",nc));
  svg.querySelectorAll(".chord-name").forEach(e=>{e.setAttribute("fill",name);e.setAttribute("stroke",name);e.setAttribute("font-family",font)});
  svg.querySelectorAll(".marker-text").forEach(e=>e.setAttribute("fill",dc));
  svg.querySelectorAll(".chord-slot circle").forEach(e=>e.setAttribute("stroke",dc));
  svg.querySelectorAll(".chord-slot").forEach(e=>e.setAttribute("opacity",op));
}
["diagramColor","numberColor","nameColor","chordFont","diagramOpacity"].forEach(id=>q(id).oninput=()=>applyAppearance(false));
["diagramColor","numberColor","nameColor","chordFont","diagramOpacity"].forEach(id=>q(id).onchange=snapshot);
document.querySelectorAll(".number-color-btn").forEach(btn=>btn.onclick=()=>{
  q("numberColor").value=btn.dataset.color;
  document.querySelectorAll(".number-color-btn").forEach(b=>b.classList.toggle("active",b===btn));
  applyAppearance(false);snapshot();
});


function replaceSlot(slotNum,chordName){
  if(mode==="fixed")return;
  const slot=svg.querySelector("#slot-"+slotNum),item=LIBRARY[chordName]; if(!slot||!item)return;
  const base=slot.getAttribute("data-base-transform")||slot.getAttribute("transform")||"";
  slot.innerHTML=item.drawing;

  let chordNameEl=slot.querySelector(".chord-name");
  if(!chordNameEl){
    chordNameEl=document.createElementNS("http://www.w3.org/2000/svg","text");
    chordNameEl.setAttribute("x","160");
    chordNameEl.setAttribute("y","49");
    chordNameEl.setAttribute("text-anchor","middle");
    chordNameEl.setAttribute("font-size","48");
    chordNameEl.setAttribute("font-weight","900");
    chordNameEl.setAttribute("class","chord-name");
    slot.insertBefore(chordNameEl,slot.firstChild);
  }
  chordNameEl.textContent=chordName;

  slot.setAttribute("class","chord-slot");slot.setAttribute("id","slot-"+slotNum);slot.setAttribute("data-slot",slotNum);
  slot.setAttribute("data-base-transform",base);slot.setAttribute("transform",base);
  wireSlot(slot);applyAppearance(false);snapshot();
  status("Slot "+slotNum+" changed to "+chordName+".");
}

q("applyLibraryChord").onclick=()=>{
  const slotNum=+q("librarySlot").value;
  const chordName=q("libraryChord").value;
  replaceSlot(slotNum,chordName);
};


function wireSlot(slot){
  slot.onclick=e=>{e.stopPropagation();selectSlot(slot)};
  slot.onpointerdown=e=>{
    if(mode!=="advanced")return;
    e.preventDefault();selectSlot(slot);
    const startX=e.clientX,startY=e.clientY,startDX=+(slot.dataset.dx||0),startDY=+(slot.dataset.dy||0);
    const rect=svg.getBoundingClientRect(),sx=2327/rect.width,sy=1086/rect.height;
    const move=ev=>{q("moveX").value=Math.max(-250,Math.min(250,startDX+(ev.clientX-startX)*sx));q("moveY").value=Math.max(-180,Math.min(180,startDY+(ev.clientY-startY)*sy));applyTransform()};
    const up=()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);snapshot()};
    window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
  };
}
function wireSlots(){svg.querySelectorAll(".chord-slot").forEach(wireSlot)}

function selectSlot(slot){
  if(mode!=="advanced")return;

  q("moveX").value=slot.dataset.dx||0;q("moveY").value=slot.dataset.dy||0;q("scale").value=slot.dataset.scale||100;

}
function applyTransform(){
  if(!selected||mode!=="advanced")return;
  const dx=+q("moveX").value,dy=+q("moveY").value,sc=+q("scale").value/100,base=selected.getAttribute("data-base-transform")||"";
  selected.dataset.dx=dx;selected.dataset.dy=dy;selected.dataset.scale=Math.round(sc*100);
  selected.setAttribute("transform",base+" translate("+dx+" "+dy+") scale("+sc+")");
}
["moveX","moveY","scale"].forEach(id=>q(id).oninput=applyTransform);

function snapshot(){
  if(!svg)return;
  const current=new XMLSerializer().serializeToString(svg);
  const stack=undo[mode];
  if(stack[stack.length-1]!==current){stack.push(current);if(stack.length>30)stack.shift()}
  redo[mode]=[];
  states[mode]=current;
}
function restore(source){
  frame.querySelector("svg")?.remove();frame.insertAdjacentHTML("beforeend",source);svg=frame.querySelector("svg");states[mode]=source;selected=null;guides=svg.querySelector("#app-guides");wireSlots();syncControlsFromSvg();applyBackground();
}
q("undoButton").onclick=()=>{const stack=undo[mode];if(stack.length<2)return;redo[mode].push(stack.pop());restore(stack[stack.length-1])};
q("redoButton").onclick=()=>{const r=redo[mode];if(!r.length)return;const s=r.pop();undo[mode].push(s);restore(s)};

function syncControlsFromSvg(){
  if(mode==="fixed")return;

    q("titleInput").value=t.textContent;
    q("titleSize").value=t.getAttribute("font-size")||78;
    q("titleFont").value=t.getAttribute("font-family")||"Arial, Helvetica, sans-serif";
    q("titleColor").value=t.getAttribute("fill")||"#111111";
    q("headerSpacing").value=t.getAttribute("letter-spacing")||0;
    q("showTitle").checked=t.style.display!=="none";

    q("footerInput").value=f.textContent;

    q("showFooter").checked=f.style.display!=="none";

  if(n) q("chordFont").value=n.getAttribute("font-family")||"Arial, Helvetica, sans-serif";
  const currentNumber=(svg.querySelector(".finger-number")?.getAttribute("fill")||"#ffffff").toLowerCase();
  q("numberColor").value=currentNumber==="#000000"||currentNumber==="black"?"#000000":"#ffffff";
  document.querySelectorAll(".number-color-btn").forEach(b=>b.classList.toggle("active",b.dataset.color===q("numberColor").value));

}

q("resetDiagrams").onclick=()=>{
  if(mode==="fixed"){status("The fixed transparent layout is already locked.");return}
  const fresh=freshSvg();
  const freshSlots=[...fresh.querySelectorAll(".chord-slot")];
  const currentSlots=[...svg.querySelectorAll(".chord-slot")];
  currentSlots.forEach((slot,i)=>{
    const replacement=freshSlots[i];
    if(!replacement)return;
    slot.innerHTML=replacement.innerHTML;
    slot.setAttribute("transform",slot.getAttribute("data-base-transform")||replacement.getAttribute("transform")||"");
    slot.style.display="";
    slot.dataset.dx=0;slot.dataset.dy=0;slot.dataset.scale=100;
  });
  q("librarySlot").value="1";q("libraryChord").value=DEFAULTS[0];
  selected=null;wireSlots();applyAppearance(false);snapshot();
  status("All chord diagrams reset to the original 12-chord layout.");
};

const GOOGLE_FONT_CSS_URL="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Anton&family=Archivo+Black&family=Bangers&family=Bebas+Neue&family=Black+Ops+One&family=Boogaloo&family=Bowlby+One+SC&family=Bungee&family=Bungee+Shade&family=Cinzel+Decorative:wght@700&family=Creepster&family=Faster+One&family=Frijole&family=Graduate&family=Knewave&family=Lacquer&family=Lilita+One&family=Lobster&family=Metal+Mania&family=Monoton&family=New+Rocker&family=Nosifer&family=Oswald:wght@400;700&family=Permanent+Marker&family=Pirata+One&family=Press+Start+2P&family=Rock+Salt&family=Rubik+Distressed&family=Rubik+Glitch&family=Rye&family=Sancreek&family=Sedgwick+Ave+Display&family=Special+Elite&family=Staatliches&family=Trade+Winds&family=Ultra&family=UnifrakturCook:wght@700&display=swap";
let embeddedFontCssPromise=null;

function blobToDataUrl(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(blob);
  });
}

async function getEmbeddedGoogleFontCss(){
  if(embeddedFontCssPromise)return embeddedFontCssPromise;
  embeddedFontCssPromise=(async()=>{
    try{
      const cssResponse=await fetch(GOOGLE_FONT_CSS_URL);
      if(!cssResponse.ok)throw new Error("Font CSS request failed");
      let css=await cssResponse.text();
      const urls=[...css.matchAll(/url\((https:[^)]+)\)/g)].map(m=>m[1]);
      const unique=[...new Set(urls)];
      for(const url of unique){
        const response=await fetch(url);
        if(!response.ok)continue;
        const dataUrl=await blobToDataUrl(await response.blob());
        css=css.split(url).join(dataUrl);
      }
      return css;
    }catch(error){
      console.warn("Could not embed web fonts for export.",error);
      return "";
    }
  })();
  return embeddedFontCssPromise;
}

async function exportClone(){
  await document.fonts.ready;
  const c=svg.cloneNode(true);
  c.querySelectorAll(".selected").forEach(e=>e.classList.remove("selected"));
  c.querySelector("#app-guides")?.remove();
  c.setAttribute("width","2327");
  c.setAttribute("height","1086");

  const fontCss=await getEmbeddedGoogleFontCss();
  if(fontCss){
    const defs=document.createElementNS("http://www.w3.org/2000/svg","defs");
    const style=document.createElementNS("http://www.w3.org/2000/svg","style");
    style.textContent=fontCss;
    defs.appendChild(style);
    c.insertBefore(defs,c.firstChild);
  }

  if(q("bgVisible").checked){
    const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
    r.setAttribute("width","2327");
    r.setAttribute("height","1086");
    r.setAttribute("fill",q("bgColor").value);
    c.insertBefore(r,c.firstChild);
  }

  if(backgroundImageData){
    const im=document.createElementNS("http://www.w3.org/2000/svg","image");
    im.setAttribute("href",backgroundImageData);
    im.setAttribute("x","0");
    im.setAttribute("y","0");
    im.setAttribute("width","2327");
    im.setAttribute("height","1086");
    im.setAttribute("opacity",q("bgOpacity").value/100);
    const fit=q("bgFit").value;
    im.setAttribute("preserveAspectRatio",fit==="stretch"?"none":fit==="contain"?"xMidYMid meet":"xMidYMid slice");
    const first=c.firstChild;
    if(first && first.tagName==="rect")c.insertBefore(im,first.nextSibling);
    else c.insertBefore(im,first);
  }
  return c;
}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
q("exportSvg").onclick=async()=>{
  document.body.classList.add("exporting");
  status("Preparing fonts for SVG export...");
  try{
    const c=await exportClone();
    download(new Blob([new XMLSerializer().serializeToString(c)],{type:"image/svg+xml"}),"Chord Mug.svg");
    status("SVG exported.");
  }finally{
    document.body.classList.remove("exporting");
  }
};

q("exportPng").onclick=async()=>{
  document.body.classList.add("exporting");
  status("Preparing fonts for PNG export...");
  try{
    const c=await exportClone();
    const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(c)],{type:"image/svg+xml"}));
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement("canvas");
      cv.width=2327;
      cv.height=1086;
      cv.getContext("2d").drawImage(img,0,0);
      URL.revokeObjectURL(url);
      cv.toBlob(blob=>{
        download(blob,"Chord Mug.png");
        status("PNG exported with embedded fonts.");
        document.body.classList.remove("exporting");
      },"image/png");
    };
    img.onerror=()=>{
      URL.revokeObjectURL(url);
      status("PNG export failed. Try again after the fonts finish loading.");
      document.body.classList.remove("exporting");
    };
    img.src=url;
  }catch(error){
    console.error(error);
    status("PNG export failed.");
    document.body.classList.remove("exporting");
  }
};
